# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys BLOCKFALL as a static site on Render's global CDN.
services:
  - type: web
    runtime: static
    name: blockfall
    # Nothing to build: index.html is fully self-contained.
    buildCommand: "echo 'static site — nothing to build'"
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      # Single-page site: send everything to index.html
      - type: rewrite
        source: /*
        destination: /index.html
